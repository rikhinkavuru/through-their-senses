[project]
name = "hearing"
version = "0.1.0"
description = "Hearing loss simulation (MSBG) and proxy listener for Through Their Senses"
requires-python = ">=3.12"
dependencies = [
    "cmudict>=1.1.3",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "num2words>=0.5.14",
    "numpy>=2.5.3",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]
